name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "GitHub tag version: ${TAG}"
          echo "Package version:    ${PKG}"
          if [ "${TAG}" != "${PKG}" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' does not match package version ${PKG}. Tag v${PKG} (or bump pyproject.toml / src/af3parallel/__version__.py first)."
            exit 1
          fi

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
        # One-time PyPI setup (required):
        #   https://pypi.org/manage/project/af3parallel/settings/publishing/
        #   Owner=Xin-DongXu  Repository=AF3Parallel
        #   Workflow=publish-pypi.yml  Environment=pypi
